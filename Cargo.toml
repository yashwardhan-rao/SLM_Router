[package]
name = "slm-router"
version = "0.4.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.2.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
